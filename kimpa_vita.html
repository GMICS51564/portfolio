<style>

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:9px; padding:9px 13px; font-weight:600; font-size:13px; border:1px solid #334155; transition:.15s; cursor:pointer; }

  .nav-item.active { background:#172554; color:#bfdbfe; border:1px solid #1d4ed8; }

  .badge-green { background:#052e1a; color:#86efac; border:1px solid #166534; }
  .badge-red { background:#3b1118; color:#fca5a5; border:1px solid #7f1d1d; }
  .badge-orange { background:#3b2108; color:#fdba74; border:1px solid #9a3412; }
  .badge-blue { background:#0c2442; color:#93c5fd; border:1px solid #1d4ed8; }
  .badge-gray { background:#1e293b; color:#cbd5e1; border:1px solid #334155; }

<body>
<div id="toast" class="toast"></div>

<!-- SIDEBAR -->
<aside class="fixed left-0 top-0 bottom-0 w-64 bg-[#0b1220] border-r border-slate-800 z-30 flex flex-col">
  <div class="p-5 border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-900/30">
        <i data-lucide="factory" class="w-5 h-5 text-white"></i>
      </div>
      <div class="brand-text">
        <div class="font-black tracking-wide text-white">VITA</div>
        <div class="text-[10px] text-slate-500 uppercase tracking-widest">Maintenance Intelligence</div>
      </div>
    </div>
    <div class="mt-3 inline-flex badge badge-blue">V1 • GMAO opérationnelle</div>
  </div>

  <nav class="p-3 space-y-1 flex-1 overflow-y-auto scrollbar">
    <div class="px-3 pt-2 pb-2 text-[10px] uppercase tracking-widest text-slate-600 nav-label">Pilotage</div>
    <button class="nav-item active" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span class="nav-label">Dashboard</span></button>

    <div class="px-3 pt-4 pb-2 text-[10px] uppercase tracking-widest text-slate-600 nav-label">Maintenance</div>
    <button class="nav-item" data-view="equipment"><i data-lucide="boxes"></i><span class="nav-label">Parc équipements</span></button>
    <button class="nav-item" data-view="interventions"><i data-lucide="wrench"></i><span class="nav-label">Interventions</span></button>
    <button class="nav-item" data-view="preventive"><i data-lucide="calendar-cog"></i><span class="nav-label">Maintenance préventive</span></button>
    <button class="nav-item" data-view="providers"><i data-lucide="building-2"></i><span class="nav-label">Prestataires</span></button>
    <button class="nav-item" data-view="documents"><i data-lucide="folder-open"></i><span class="nav-label">Documentation</span></button>

    <div class="px-3 pt-4 pb-2 text-[10px] uppercase tracking-widest text-slate-600 nav-label">Données</div>
    <button class="nav-item" data-view="history"><i data-lucide="search"></i><span class="nav-label">Historique & Recherche</span></button>
    <button class="nav-item" data-view="kimpa"><i data-lucide="brain-circuit"></i><span class="nav-label">KIMPA • Analyse industrielle</span><span class="ml-auto badge badge-blue">4.0</span></button>
    <button class="nav-item" data-view="notifications"><i data-lucide="bell"></i><span class="nav-label">Notifications</span><span id="notification-count" class="ml-auto badge badge-red">0</span></button>

    <div class="px-3 pt-4 pb-2 text-[10px] uppercase tracking-widest text-slate-600 nav-label">Administration</div>
    <button class="nav-item" data-view="admin"><i data-lucide="settings"></i><span class="nav-label">Administration</span></button>
  </nav>

  <div class="p-3 border-t border-slate-800 user-info">
    <div class="panel-soft p-3">
      <div class="text-xs font-semibold text-slate-200">Utilisateur démo</div>
      <div class="text-[11px] text-slate-500 mt-1">Responsable maintenance</div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main class="ml-64 min-h-screen">
  <div class="mobile-top sticky top-0 z-20 bg-[#0b1220]/95 backdrop-blur border-b border-slate-800 p-3 items-center justify-between">
    <div class="font-black text-white">VITA</div>
    <button class="btn btn-secondary" onclick="openNewIntervention()"><i data-lucide="plus"></i> Intervention</button>
  </div>

  <header class="sticky top-0 z-20 bg-[#0b1220]/92 backdrop-blur border-b border-slate-800">
    <div class="px-6 py-4 flex flex-wrap gap-3 items-center justify-between">
      <div>
        <div id="page-title" class="text-xl font-bold text-white">Dashboard</div>
        <div id="page-subtitle" class="text-xs text-slate-500 mt-1">Pilotage opérationnel de la maintenance</div>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn btn-secondary" onclick="exportCSV()"><i data-lucide="download"></i> Exporter</button>
        <button class="btn btn-primary" onclick="openNewIntervention()"><i data-lucide="plus"></i> Nouvelle intervention</button><button class="btn btn-secondary" onclick="openKimpaFromVita(state.view)"><i data-lucide="brain-circuit"></i> KIMPA</button>
      </div>
    </div>
  </header>

  <div class="p-6 space-y-5">
    <!-- GLOBAL FILTER BAR -->
    <section class="panel p-4">
      <div class="flex flex-wrap items-end gap-3">
        <div class="flex-1 min-w-[220px]">
          <label class="block text-[11px] text-slate-500 mb-1">Recherche</label>
          <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-600"></i>
            <input id="global-search" class="input pl-9" placeholder="Équipement, panne, action, technicien..." oninput="setFilter('search',this.value)">
          </div>
        </div>
        <div class="w-44">
          <label class="block text-[11px] text-slate-500 mb-1">Équipement</label>
          <select id="global-equipment" class="input" onchange="setFilter('equipment',this.value)"></select>
        </div>
        <div class="w-36">
          <label class="block text-[11px] text-slate-500 mb-1">Type</label>
          <select id="global-type" class="input" onchange="setFilter('type',this.value)">
            <option value="all">Tous</option><option value="Préventive">Préventive</option><option value="Corrective">Corrective</option><option value="Améliorative">Améliorative</option>
          </select>
        </div>
        <div class="w-36">
          <label class="block text-[11px] text-slate-500 mb-1">Origine</label>
          <select id="global-origin" class="input" onchange="setFilter('origin',this.value)">
            <option value="all">Toutes</option><option value="Interne">Interne</option><option value="Externe">Externe</option>
          </select>
        </div>
        <div class="w-36">
          <label class="block text-[11px] text-slate-500 mb-1">Statut</label>
          <select id="global-status" class="input" onchange="setFilter('status',this.value)">
            <option value="all">Tous</option><option>Demande</option><option>Diagnostic</option><option>Planifiée</option><option>Intervention</option><option>Compte rendu</option><option>Validation</option><option>Clôturée</option>
          </select>
        </div>
        <button class="btn btn-secondary" onclick="toggleDates()"><i data-lucide="calendar-range"></i> Période</button>
        <button class="btn btn-ghost" onclick="resetFilters()"><i data-lucide="rotate-ccw"></i> Réinitialiser</button>
      </div>

      <div id="date-panel" class="hidden mt-4 pt-4 border-t border-slate-800">
        <div class="flex flex-wrap gap-2 mb-3">
          <button class="btn btn-secondary" onclick="preset('today')">Aujourd'hui</button>
          <button class="btn btn-secondary" onclick="preset('7d')">7 jours</button>
          <button class="btn btn-secondary" onclick="preset('30d')">30 jours</button>
          <button class="btn btn-secondary" onclick="preset('month')">Mois en cours</button>
          <button class="btn btn-secondary" onclick="preset('prevmonth')">Mois précédent</button>
          <button class="btn btn-secondary" onclick="preset('year')">Année en cours</button>
          <button class="btn btn-secondary" onclick="preset('prevyear')">Année précédente</button>
          <button class="btn btn-secondary" onclick="clearDates()">Toutes les dates</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div><label class="block text-[11px] text-slate-500 mb-1">Du</label><input id="date-from" type="date" class="input"></div>
          <div><label class="block text-[11px] text-slate-500 mb-1">Au</label><input id="date-to" type="date" class="input"></div>
          <div class="flex items-end"><button class="btn btn-primary w-full" onclick="applyDates()"><i data-lucide="check"></i> Appliquer la période</button></div>
        </div>
      </div>

      <div id="period-banner" class="mt-3 text-xs text-slate-500"></div>
    </section>

    <div id="app"></div>
  </div>
</main>

<!-- MODAL -->
<div id="modal-backdrop" class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
  <div id="modal" class="modal"></div>
</div>

function fmtDate(d){
  if(!d) return '—';
  const [y,m,day]=String(d).split('-');
  return day && m && y ? `${day}/${m}/${y}` : d;
}
function isoDate(d=new Date()){
  const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset());
  return x.toISOString().slice(0,10);
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return isoDate(d); }

  return `<span class="badge ${cls}">${esc(text)}</span>`;
}

    if(f.origin!=='all' && i.origin!==f.origin) return false;

function preset(p){
  const now=new Date(), today=isoDate(now);
  let from=today,to=today;
  if(p==='7d'){from=daysAgo(6);to=today;}
  if(p==='30d'){from=daysAgo(29);to=today;}
  if(p==='month'){from=isoDate(new Date(now.getFullYear(),now.getMonth(),1));to=today;}
  if(p==='prevmonth'){from=isoDate(new Date(now.getFullYear(),now.getMonth()-1,1));to=isoDate(new Date(now.getFullYear(),now.getMonth(),0));}
  if(p==='year'){from=isoDate(new Date(now.getFullYear(),0,1));to=today;}
  if(p==='prevyear'){from=isoDate(new Date(now.getFullYear()-1,0,1));to=isoDate(new Date(now.getFullYear()-1,11,31));}
  state.filters.dateFrom=from; state.filters.dateTo=to; render(); showToast('Période : '+periodLabel().replace('Période analysée : ',''));
}

    </div>

}
function metrics(list){
  const failures=list.filter(i=>i.type==='Corrective'&&i.failure&&i.failure!=='-');
  const downtime=list.reduce((s,i)=>s+Number(i.downtime||0),0);
  const repair=list.reduce((s,i)=>s+Number(i.duration||0),0);
  const mttr=failures.length?repair/failures.length:0;
  const cost=list.reduce((s,i)=>s+Number(i.cost||0),0);
  const preventiveCount=list.filter(i=>i.type==='Préventive').length;
  const correctiveCount=list.filter(i=>i.type==='Corrective').length;
  const uniqueEq=new Set(list.map(i=>i.equipmentId)).size;
  let mtbf=0;
  if(failures.length>1){
    const by={};
    failures.forEach(i=>(by[i.equipmentId]??=[]).push(i.date));
    const intervals=[];
    Object.values(by).forEach(ds=>{
      ds.sort();
      for(let j=1;j<ds.length;j++) intervals.push((new Date(ds[j])-new Date(ds[j-1]))/36e5);
    });
    if(intervals.length) mtbf=intervals.reduce((a,b)=>a+b,0)/intervals.length;
  }
  return {failures,downtime,repair,mttr,cost,preventiveCount,correctiveCount,uniqueEq,mtbf};
}

function topEquipment(list){
  const map={};
  list.forEach(i=>{map[i.equipmentId]=(map[i.equipmentId]||0)+1;});
  return Object.entries(map).map(([id,count])=>({id,name:getEquipment(id)?.designation||id,count})).sort((a,b)=>b.count-a.count);
}
function groupByFailure(list){
  const map={};
  list.forEach(i=>{map[i.failure]=(map[i.failure]||0)+1;});
  return Object.entries(map).filter(([n])=>n&&n!=='-').map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
}

   KIMPA BRIDGE — intégration VITA V1 → KIMPA 4.0
   ============================================================ */
let kimpaContext={view:'dashboard',equipmentId:null,dataset:[]};

function openKimpaFromVita(view='dashboard',equipmentId=null){
  kimpaContext={view,equipmentId,dataset:kimpaBuildDataset(view,equipmentId)};
  state.view='kimpa'; state.selectedEquipment=null; state.selectedProvider=null; render();
}

function kimpaBuildDataset(view,equipmentId){
  let rows=(view==='equipment'&&equipmentId)
    ? interventions.filter(i=>i.equipmentId===equipmentId)
    : filteredInterventions();
  return rows.map(i=>({
    id:i.id,date:i.date,time:i.time,equipment_id:i.equipmentId,
    technician:i.technician,type:i.type,origin:i.origin,symptom:i.symptom,
    failure:i.failure,cause:i.cause,action:i.action,parts:i.parts,
    duration_h:Number(i.duration||0),downtime_h:Number(i.downtime||0),
    cost_eur:Number(i.cost||0),status:i.status,provider_id:i.providerId,
    comments:i.comments
  }));
}

function kimpaQuality(df){
  const issues=[];
  if(!df.length) issues.push(['CRITIQUE','Le jeu de données est vide.']);
  if(df.length<5) issues.push(['CRITIQUE',`${df.length} observation(s) : jeu trop petit.`]);
  if(df.length){
    Object.keys(df[0]).forEach(c=>{
      const miss=df.filter(r=>r[c]===''||r[c]===null||r[c]===undefined).length;
      if(miss/df.length>=.3) issues.push(['ATTENTION',`${c} contient ${Math.round(miss/df.length*100)}% de valeurs manquantes.`]);
    });
  }
  return issues;
}

function kimpaSemantics(df){
  if(!df.length)return[];
  return Object.keys(df[0]).map(c=>{
    const n=c.toLowerCase(); let role='Variable générale',conf=.30;
    if(n.includes('date')||n==='time'){role='Variable temporelle';conf=.90}
    else if(n.includes('id')||n.includes('equipment')){role='Identifiant potentiel';conf=.85}
    else if(['failure','panne','defaillance','defaut','status','event'].some(x=>n.includes(x))){role='Événement / cible potentielle';conf=.85}
    else if(['duration','duree','downtime','cost','cout'].some(x=>n.includes(x))){role='Variable quantitative';conf=.70}
    else if(typeof df[0][c]==='number'){role='Variable quantitative';conf=.60}
    else role='Variable catégorielle';
    return {name:c,role,conf};
  });
}

function kimpaStats(df){
  const failures=df.filter(r=>r.type==='Corrective'&&r.failure&&r.failure!=='-');
  const downtime=df.reduce((s,r)=>s+Number(r.downtime_h||0),0);
  const repair=df.reduce((s,r)=>s+Number(r.duration_h||0),0);
  const mttr=failures.length?repair/failures.length:0;
  const cost=df.reduce((s,r)=>s+Number(r.cost_eur||0),0);
  const failureMap={}; const eqMap={};
  failures.forEach(r=>{failureMap[r.failure]=(failureMap[r.failure]||0)+1;eqMap[r.equipment_id]=(eqMap[r.equipment_id]||0)+1});
  const pareto=Object.entries(failureMap).sort((a,b)=>b[1]-a[1]);
  const recurrent=Object.entries(eqMap).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]);
  const by={}; failures.forEach(r=>(by[r.equipment_id]??=[]).push(r.date));
  const intervals=[];
  Object.values(by).forEach(ds=>{ds.sort();for(let j=1;j<ds.length;j++){const h=(new Date(ds[j])-new Date(ds[j-1]))/36e5;if(h>=0)intervals.push(h)}})
  const mtbf=intervals.length?intervals.reduce((a,b)=>a+b,0)/intervals.length:0;
  return {failures,downtime,repair,mttr,cost,pareto,recurrent,mtbf};
}

function kimpaLeakage(df,target){
  if(!target||!df.length)return[];
  const kw=['failure','panne','defaillance','cause','action','diagnostic','reparation','remplacement','comment','description','downtime'];
  return Object.keys(df[0]).filter(c=>c===target||kw.some(k=>c.toLowerCase().includes(k)));
}

function kimpaRun(){
  const df=kimpaContext.dataset, s=kimpaStats(df), q=kimpaQuality(df);
  const type=document.getElementById('kimpa-type').value;
  const target=document.getElementById('kimpa-target').value;
  let html='';
  if(type==='Fiabilité'){
    html=`<div class="grid grid-cols-2 xl:grid-cols-4 gap-3">${kpi('Observations',df.length,'Snapshot VITA','database')}${kpi('Pannes',s.failures.length,'Correctives','triangle-alert')}${kpi('MTTR',fmtHours(s.mttr),'Maintenabilité','timer')}${kpi('MTBF',s.mtbf?fmtHours(s.mtbf):'—','Intervalles disponibles','activity')}</div>
    <div class="grid lg:grid-cols-2 gap-4 mt-4"><div class="panel-soft p-4"><b>Défaillances — Pareto</b>${s.pareto.map(x=>`<div class="mt-3"><div class="flex justify-between text-xs"><span>${esc(x[0])}</span><span>${x[1]}</span></div><div class="bar-bg mt-1"><div class="bar" style="width:${Math.min(100,x[1]/(s.pareto[0]?.[1]||1)*100)}%"></div></div></div>`).join('')||'<div class="empty">Aucune défaillance.</div>'}</div>
    <div class="panel-soft p-4"><b>Récurrences</b>${s.recurrent.map(x=>`<div class="flex justify-between mt-3 text-sm"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')||'<div class="text-slate-500 text-sm mt-3">Aucune récurrence ≥ 2.</div>'}</div></div>`;
  }else if(type==='Diagnostic'){
    const causes={};df.forEach(r=>{const c=r.cause||'-';causes[c]=(causes[c]||0)+1});
    html=`<div class="panel-soft p-4"><b>Causes enregistrées dans VITA</b>${Object.entries(causes).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="flex justify-between mt-3 text-sm"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join('')}</div>`;
  }else if(type==='Détection'){
    html=`<div class="panel-soft p-4 border-amber-900/60"><b class="text-amber-300">Signaux détectés</b>${s.recurrent.map(x=>`<p class="mt-3 text-sm">⚠️ ${esc(x[0])} : ${x[1]} défaillances dans le périmètre.</p>`).join('')||'<p class="text-sm text-slate-500 mt-3">Aucune récurrence selon la règle actuelle.</p>'}${s.pareto[0]?`<p class="mt-3 text-sm">⚠️ Défaillance dominante : <b>${esc(s.pareto[0][0])}</b>.</p>`:''}</div>`;
  }else if(type==='Prédiction'){
    html=`<div class="panel-soft p-4 border-blue-900/60"><b class="text-blue-300">Préparation du modèle KIMPA</b><p class="text-sm text-slate-400 mt-2">${df.length<10?'Le dataset contient moins de 10 observations : validation train/test non exécutable de façon robuste.':'Le volume permet une tentative train/test.'}</p><p class="text-sm mt-3">${target?'Cible sélectionnée : <b>'+esc(target)+'</b>.':'Aucune cible sélectionnée.'}</p><p class="text-xs text-slate-500 mt-3">Le moteur ML complet (scikit-learn, train/test, métriques et coefficients) reste exécuté par l’application Python KIMPA. Cette couche HTML prépare et exporte exactement le contexte.</p></div>`;
  }else{
    const sem=kimpaSemantics(df);
    html=`<div class="grid grid-cols-2 md:grid-cols-4 gap-3">${kpi('Observations',df.length,'Dataset','database')}${kpi('Variables',sem.length,'Sémantique','columns-3')}${kpi('Temps d’arrêt',fmtHours(s.downtime),'Cumul','clock-3')}${kpi('Coût',money(s.cost),'Maintenance','euro')}</div><div class="table-wrap mt-4"><table><thead><tr><th>Variable</th><th>Rôle</th><th>Confiance</th></tr></thead><tbody>${sem.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.role)}</td><td>${Math.round(x.conf*100)}%</td></tr>`).join('')}</tbody></table></div>`;
  }
  const quality=q.length?`<div class="panel-soft p-4 mt-4 border-amber-900/60"><b class="text-amber-300">Qualité des données</b>${q.map(x=>`<div class="text-sm mt-2">• ${esc(x[0])} — ${esc(x[1])}</div>`).join('')}</div>`:`<div class="panel-soft p-4 mt-4 border-emerald-900/60"><span class="text-emerald-300 text-sm">✓ Aucun problème critique détecté.</span></div>`;
  const leak=target?`<div class="panel-soft p-4 mt-4"><b>Anti-leakage</b><div class="flex flex-wrap gap-2 mt-3">${kimpaLeakage(df,target).map(x=>`<span class="badge badge-gray">${esc(x)}</span>`).join('')}</div></div>`:'';
  document.getElementById('kimpa-result').innerHTML=html+quality+leak;
  document.getElementById('kimpa-status').textContent='Analyse exécutée';
  lucide.createIcons();
}

}
function saveDocument(ev){
  ev.preventDefault();const f=new FormData(ev.target);
  documents.push({id:'DOC-'+String(Date.now()).slice(-6),name:f.get('name'),type:f.get('type'),equipmentId:f.get('equipmentId'),version:f.get('version')||'1.0',date:isoDate(),author:'Utilisateur démo'});
  save();closeModal();showToast('Document ajouté.');render();
}
function openNewUser(){

}
function saveUser(ev){
  ev.preventDefault();const f=new FormData(ev.target);
  users.push({id:'USR-'+String(Date.now()).slice(-6),name:f.get('name'),role:f.get('role'),email:f.get('email'),status:'Actif'});save();closeModal();showToast('Utilisateur ajouté.');render();
}
function exportCSV(){
  const list=filteredInterventions();
  const header=['ID','Date','Heure','Equipement','Type','Origine','Technicien','Symptome','Defaillance','Cause','Action','Duree_h','Arret_h','Cout_EUR','Statut','Prestataire'];
  const rows=list.map(i=>[i.id,i.date,i.time,i.equipmentId,i.type,i.origin,i.technician,i.symptom,i.failure,i.cause,i.action,i.duration,i.downtime,i.cost,i.status,providerName(i.providerId)]);
  const csv=[header,...rows].map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`VITA_interventions_${isoDate()}.csv`;a.click();URL.revokeObjectURL(a.href);
  showToast(`${list.length} intervention(s) exportée(s).`);
}
function resetDemo(){
  if(!confirm('Réinitialiser VITA avec les données de démonstration ?'))return;
  equipment=structuredClone(demoEquipment);interventions=structuredClone(demoInterventions);preventive=structuredClone(demoPreventive);providers=structuredClone(demoProviders);documents=structuredClone(demoDocuments);users=structuredClone(demoUsers);notifications=[];resetFilters();save();showToast('Données VITA réinitialisées.');render();
}
function clearAllData(){
  if(!confirm('Effacer toutes les données locales VITA ?'))return;
  Object.values(KEY).forEach(k=>localStorage.removeItem(k));
  location.reload();
}

document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

save();
render();
